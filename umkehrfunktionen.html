<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Umkehrfunktionen — arcsin, arccos, arctan</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 28px 22px 60px;
    background: linear-gradient(180deg, #fbf8f1 0%, #f3eede 100%);
    color: #1f1f1f;
    min-height: 100vh;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 6px; color: #2c2418; letter-spacing: -0.01em; }
  .subtitle {
    color: #6a5d44; margin: 0 0 22px; font-size: 17px;
    font-family: Georgia, serif; font-style: italic;
  }
  .nav { text-align: right; margin-bottom: 8px; font-size: 14px; }
  .nav a {
    color: #8a6e3a; text-decoration: none;
    border-bottom: 1px dotted #c4a05a; margin-left: 12px;
  }
  .nav a:hover { color: #5a4020; }

  .panels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .panel {
    background: white;
    border: 1px solid #e8e2d0;
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: 0 2px 10px rgba(60, 40, 10, 0.06);
    display: flex;
    flex-direction: column;
  }
  .panel-title {
    font-size: 22px;
    margin: 0 0 10px;
    color: #2c2418;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0e8d0;
  }
  .panel-title .swatch {
    display: inline-block;
    width: 16px; height: 16px;
    border-radius: 4px;
  }
  .panel-title .auto-btn {
    margin-left: auto;
    padding: 5px 12px;
    border: 1px solid #d4ccb4;
    background: white;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #2c2418;
    cursor: pointer;
    font-family: inherit;
  }
  .panel-title .auto-btn:hover { background: #fbf6e6; border-color: #c4a05a; }
  .panel-title .auto-btn.running {
    background: linear-gradient(180deg, #c4a05a 0%, #a8884a 100%);
    color: white;
    border-color: #8a6e3a;
  }
  .panel-formula {
    font-family: Georgia, serif;
    font-size: 15px;
    color: #6a5d44;
    margin: 0 0 14px;
    font-style: italic;
  }
  .slider-row {
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0 12px;
    font-size: 14px; color: #6a5d44;
  }
  .slider-row input[type=range] { flex: 1; }
  .slider-row .val {
    width: 56px; text-align: right;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 14px;
    color: #2c2418;
    font-weight: 700;
  }
  svg { width: 100%; height: auto; display: block; background: #fdfbf4; border-radius: 8px; }
  .result {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .result .tile {
    background: #fbf8ee;
    border: 1px solid #ece3c6;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .result .lbl {
    font-size: 11px;
    color: #8a7a55;
    font-family: Georgia, serif;
    font-style: italic;
  }
  .result .v {
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 16px;
    font-weight: 700;
    margin-top: 2px;
  }
  .info {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.5;
    color: #5a4c30;
    font-family: Georgia, serif;
    background: #fdf4e3;
    border-left: 3px solid #c4a05a;
    border-radius: 4px;
    padding: 8px 10px;
  }
  .info b { color: #2c2418; }
  .quick {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 8px;
  }
  .quick button {
    padding: 5px 10px;
    border: 1px solid #d4ccb4;
    background: white;
    border-radius: 6px;
    font-size: 12px;
    color: #2c2418;
    cursor: pointer;
    font-family: inherit;
  }
  .quick button:hover { background: #fbf6e6; border-color: #c4a05a; }

  @media (max-width: 1000px) {
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="index.html">← Startseite</a>
      <a href="trigonometrie.html">← Sinus, Kosinus, Tangens</a>
      <a href="winkel-umrechnen.html">Winkel umrechnen →</a>
    </div>
    <h1>Umkehrfunktionen — alle drei im Vergleich</h1>
    <p class="subtitle">arcsin, arccos und arctan finden den Winkel zu einem gegebenen Funktionswert. Bewege die Schieberegler und beobachte alle drei gleichzeitig.</p>

    <div class="panels">
      <div class="panel" id="panel-sin"></div>
      <div class="panel" id="panel-cos"></div>
      <div class="panel" id="panel-tan"></div>
    </div>
  </div>

<script>
(() => {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function fmt(n, d=3) {
    if (!isFinite(n)) return '—';
    return (Math.round(n * Math.pow(10,d)) / Math.pow(10,d)).toFixed(d);
  }
  function fmtDeg(n) { return isFinite(n) ? fmt(n, 1) + '°' : '—'; }
  function fmtRad(rad) {
    if (!isFinite(rad)) return '—';
    if (Math.abs(rad) < 1e-9) return '0';
    const piMult = rad / Math.PI;
    const fractions = [
      [1, 'π'], [-1, '−π'],
      [1/2, 'π/2'], [-1/2, '−π/2'],
      [1/3, 'π/3'], [-1/3, '−π/3'],
      [1/4, 'π/4'], [-1/4, '−π/4'],
      [1/6, 'π/6'], [-1/6, '−π/6'],
      [2/3, '2π/3'], [-2/3, '−2π/3'],
      [3/4, '3π/4'], [-3/4, '−3π/4'],
      [5/6, '5π/6'], [-5/6, '−5π/6'],
    ];
    for (const [v, lbl] of fractions) {
      if (Math.abs(piMult - v) < 0.0015) return lbl;
    }
    return fmt(rad, 3);
  }

  const CONFIGS = {
    sin: {
      color: '#c44a4a',
      titleLbl: 'arcsin',
      formula: 'gesucht: α mit sin α = y',
      sliderLbl: 'y',
      sliderMin: -1, sliderMax: 1, sliderStep: 0.01, defaultValue: 0.5,
      domain: 'y ∈ [−1, 1]',
      rangeDeg: 'α ∈ [−90°, 90°]',
      rangeRad: 'α ∈ [−π/2, π/2]',
      info: 'Hauptwertbereich: <b>α ∈ [−90°, 90°]</b>. Der Sinus nimmt dort jeden Wert in [−1, 1] genau einmal an.',
      fn: Math.asin,
      examples: [
        { label: 'y = −1', value: -1 },
        { label: 'y = 0', value: 0 },
        { label: 'y = ½', value: 0.5 },
        { label: 'y = √2/2', value: Math.SQRT2/2 },
        { label: 'y = √3/2', value: Math.sqrt(3)/2 },
        { label: 'y = 1', value: 1 },
      ],
    },
    cos: {
      color: '#3a6480',
      titleLbl: 'arccos',
      formula: 'gesucht: α mit cos α = x',
      sliderLbl: 'x',
      sliderMin: -1, sliderMax: 1, sliderStep: 0.01, defaultValue: 0.5,
      domain: 'x ∈ [−1, 1]',
      rangeDeg: 'α ∈ [0°, 180°]',
      rangeRad: 'α ∈ [0, π]',
      info: 'Hauptwertbereich: <b>α ∈ [0°, 180°]</b>. Der Kosinus nimmt dort jeden Wert in [−1, 1] genau einmal an.',
      fn: Math.acos,
      examples: [
        { label: 'x = −1', value: -1 },
        { label: 'x = 0', value: 0 },
        { label: 'x = ½', value: 0.5 },
        { label: 'x = √2/2', value: Math.SQRT2/2 },
        { label: 'x = √3/2', value: Math.sqrt(3)/2 },
        { label: 'x = 1', value: 1 },
      ],
    },
    tan: {
      color: '#5a7a2e',
      titleLbl: 'arctan',
      formula: 'gesucht: α mit tan α = t',
      sliderLbl: 't',
      sliderMin: -4, sliderMax: 4, sliderStep: 0.05, defaultValue: 1,
      domain: 't ∈ ℝ',
      rangeDeg: 'α ∈ (−90°, 90°)',
      rangeRad: 'α ∈ (−π/2, π/2)',
      info: 'Hauptwertbereich: <b>α ∈ (−90°, 90°)</b>. arctan ist für jeden reellen Wert definiert.',
      fn: Math.atan,
      examples: [
        { label: 't = −√3', value: -Math.sqrt(3) },
        { label: 't = −1', value: -1 },
        { label: 't = 0', value: 0 },
        { label: 't = 1', value: 1 },
        { label: 't = √3', value: Math.sqrt(3) },
      ],
    },
  };

  function initPanel(rootEl, mode) {
    const cfg = CONFIGS[mode];
    const fmtVal = v => Math.abs(v) >= 10 ? fmt(v,1) : fmt(v,2);

    rootEl.innerHTML = `
      <h2 class="panel-title">
        <span class="swatch" style="background:${cfg.color}"></span>
        <span>${cfg.titleLbl}</span>
        <button class="auto-btn" type="button">▶ Auto</button>
      </h2>
      <div class="panel-formula">${cfg.formula}</div>
      <div class="slider-row">
        <span>${cfg.sliderLbl}</span>
        <input type="range" min="${cfg.sliderMin}" max="${cfg.sliderMax}" step="${cfg.sliderStep}" value="${cfg.defaultValue}">
        <span class="val">${fmtVal(cfg.defaultValue)}</span>
      </div>
      <svg viewBox="0 0 340 440" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="result">
        <div class="tile"><div class="lbl">Winkel (Grad)</div><div class="v deg" style="color:${cfg.color}">—</div></div>
        <div class="tile"><div class="lbl">Winkel (Bogenmaß)</div><div class="v rad" style="color:${cfg.color}">—</div></div>
      </div>
      <div class="info">${cfg.info}</div>
      <div class="quick"></div>
    `;
    const slider = rootEl.querySelector('input[type=range]');
    const valLbl = rootEl.querySelector('.val');
    const degOut = rootEl.querySelector('.deg');
    const radOut = rootEl.querySelector('.rad');
    const svg = rootEl.querySelector('svg');
    const quick = rootEl.querySelector('.quick');
    const autoBtn = rootEl.querySelector('.auto-btn');

    for (const ex of cfg.examples) {
      const b = document.createElement('button');
      b.textContent = ex.label;
      b.addEventListener('click', () => {
        if (playing) stopAuto();
        slider.value = ex.value;
        render();
      });
      quick.appendChild(b);
    }

    // Geometry constants
    const CW = 340, CH = 440;
    // Unit circle area
    const UCX = 170, UCY = 130, UR = 95;
    // Graph area
    const GX = 35, GY = 270, GW = 280, GH = 150;

    function render() {
      const v = clamp(parseFloat(slider.value), cfg.sliderMin, cfg.sliderMax);
      slider.value = v;
      valLbl.textContent = fmtVal(v);
      const rad = cfg.fn(v);
      const deg = toDeg(rad);
      degOut.textContent = fmtDeg(deg);
      radOut.textContent = fmtRad(rad);

      const s = Math.sin(rad), c = Math.cos(rad);
      const Px = UCX + UR * c;
      const Py = UCY - UR * s;

      let out = '';
      // --- Unit circle area ---
      // Axes
      out += `<line x1="${UCX-UR-18}" y1="${UCY}" x2="${UCX+UR+18}" y2="${UCY}" stroke="#bcb190" stroke-width="1" />`;
      out += `<line x1="${UCX}" y1="${UCY+UR+18}" x2="${UCX}" y2="${UCY-UR-18}" stroke="#bcb190" stroke-width="1" />`;
      // Unit circle
      out += `<circle cx="${UCX}" cy="${UCY}" r="${UR}" fill="none" stroke="#c4a05a" stroke-width="1.4" />`;

      // Highlight principal-value arc
      if (mode === 'sin') {
        out += `<path d="M ${UCX} ${UCY-UR} A ${UR} ${UR} 0 0 1 ${UCX} ${UCY+UR}" fill="none" stroke="${cfg.color}" stroke-width="3" opacity="0.32" />`;
      } else if (mode === 'cos') {
        out += `<path d="M ${UCX+UR} ${UCY} A ${UR} ${UR} 0 0 0 ${UCX-UR} ${UCY}" fill="none" stroke="${cfg.color}" stroke-width="3" opacity="0.32" />`;
      } else {
        out += `<path d="M ${UCX} ${UCY-UR+2} A ${UR} ${UR} 0 0 1 ${UCX} ${UCY+UR-2}" fill="none" stroke="${cfg.color}" stroke-width="3" opacity="0.32" stroke-dasharray="4 3" />`;
      }

      // Input indicator
      if (mode === 'sin') {
        const lineY = UCY - UR * v;
        out += `<line x1="${UCX-UR-12}" y1="${lineY}" x2="${UCX+UR+12}" y2="${lineY}" stroke="${cfg.color}" stroke-width="1.5" stroke-dasharray="4 3" />`;
        out += `<text x="${UCX+UR+15}" y="${lineY+4}" font-family="Georgia, serif" font-size="11" fill="${cfg.color}" font-weight="700">y=${fmt(v,2)}</text>`;
      } else if (mode === 'cos') {
        const lineX = UCX + UR * v;
        out += `<line x1="${lineX}" y1="${UCY-UR-12}" x2="${lineX}" y2="${UCY+UR+12}" stroke="${cfg.color}" stroke-width="1.5" stroke-dasharray="4 3" />`;
        out += `<text x="${lineX}" y="${UCY-UR-15}" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="${cfg.color}" font-weight="700">x=${fmt(v,2)}</text>`;
      } else {
        // Tangent line at x=1 and a point at height v*UR
        out += `<line x1="${UCX+UR}" y1="${UCY-UR-12}" x2="${UCX+UR}" y2="${UCY+UR+12}" stroke="#a8b89a" stroke-width="0.8" stroke-dasharray="3 2" />`;
        const tY = clamp(UCY - v * UR, UCY-UR-20, UCY+UR+20);
        out += `<circle cx="${UCX+UR}" cy="${tY}" r="4" fill="${cfg.color}" stroke="white" stroke-width="2" />`;
        out += `<line x1="${UCX+UR}" y1="${UCY}" x2="${UCX+UR}" y2="${tY}" stroke="${cfg.color}" stroke-width="2" stroke-dasharray="4 3" />`;
        out += `<text x="${UCX+UR+8}" y="${tY+4}" font-family="Georgia, serif" font-size="11" fill="${cfg.color}" font-weight="700">t=${fmt(v,2)}</text>`;
      }

      // Angle arc
      if (Math.abs(deg) > 0.5) {
        const arcR = 22;
        const sweep = deg >= 0 ? 0 : 1;
        const largeArc = Math.abs(deg) > 180 ? 1 : 0;
        out += `<path d="M ${UCX+arcR} ${UCY} A ${arcR} ${arcR} 0 ${largeArc} ${sweep} ${UCX+arcR*c} ${UCY-arcR*s}" fill="none" stroke="#b85c2e" stroke-width="1.4" />`;
      }
      // Radius
      out += `<line x1="${UCX}" y1="${UCY}" x2="${Px}" y2="${Py}" stroke="#b85c2e" stroke-width="2" />`;
      // Point
      out += `<circle cx="${Px}" cy="${Py}" r="5" fill="#b85c2e" stroke="white" stroke-width="2" />`;
      // Result label
      out += `<text x="${UCX}" y="${UCY+UR+34}" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c2418" font-weight="700">α = ${fmtDeg(deg)} = ${fmtRad(rad)}</text>`;

      // --- Graph area ---
      let xMin, xMax, yMin, yMax, xTicks, yTicks;
      if (mode === 'sin') {
        xMin = -1.2; xMax = 1.2; yMin = -100; yMax = 100;
        xTicks = [-1, -0.5, 0, 0.5, 1];
        yTicks = [-90, -45, 0, 45, 90];
      } else if (mode === 'cos') {
        xMin = -1.2; xMax = 1.2; yMin = -10; yMax = 195;
        xTicks = [-1, -0.5, 0, 0.5, 1];
        yTicks = [0, 45, 90, 135, 180];
      } else {
        xMin = -4.5; xMax = 4.5; yMin = -100; yMax = 100;
        xTicks = [-4, -2, 0, 2, 4];
        yTicks = [-90, -45, 0, 45, 90];
      }
      const gxOf = xv => GX + (xv - xMin) / (xMax - xMin) * GW;
      const gyOf = yv => GY + GH - (yv - yMin) / (yMax - yMin) * GH;
      const xAxisY = gyOf(0);
      const yAxisX = gxOf(0);

      out += `<rect x="${GX}" y="${GY}" width="${GW}" height="${GH}" fill="#fcfaf2" stroke="#e8e2d0" stroke-width="1" rx="4" />`;
      // Grid
      out += `<line x1="${GX}" y1="${xAxisY}" x2="${GX+GW}" y2="${xAxisY}" stroke="#bcb190" stroke-width="1" />`;
      out += `<line x1="${yAxisX}" y1="${GY+4}" x2="${yAxisX}" y2="${GY+GH-4}" stroke="#bcb190" stroke-width="1" />`;
      for (const tk of yTicks) {
        const yy = gyOf(tk);
        if (yy < GY || yy > GY+GH) continue;
        out += `<text x="${yAxisX - 5}" y="${yy + 4}" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#8a7a55">${tk}°</text>`;
      }
      for (const tk of xTicks) {
        const xx = gxOf(tk);
        if (tk !== 0) out += `<text x="${xx}" y="${xAxisY + 12}" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8a7a55">${tk}</text>`;
      }
      // Curve
      const N = 160;
      let pathD = '';
      for (let i = 0; i <= N; i++) {
        const xv = xMin + (xMax - xMin) * i / N;
        if ((mode === 'sin' || mode === 'cos') && (xv < -1 || xv > 1)) continue;
        const radVal = cfg.fn(xv);
        if (!isFinite(radVal)) continue;
        const degVal = toDeg(radVal);
        pathD += (pathD ? ' L ' : 'M ') + gxOf(xv).toFixed(1) + ' ' + gyOf(degVal).toFixed(1);
      }
      out += `<path d="${pathD}" fill="none" stroke="${cfg.color}" stroke-width="2" />`;

      // Current point
      const curInRange = (mode === 'tan') || (v >= -1 && v <= 1);
      if (curInRange && isFinite(deg)) {
        const cpx = gxOf(v);
        const cpy = gyOf(deg);
        out += `<line x1="${cpx}" y1="${xAxisY}" x2="${cpx}" y2="${cpy}" stroke="#b85c2e" stroke-width="0.8" stroke-dasharray="2 2" />`;
        out += `<line x1="${yAxisX}" y1="${cpy}" x2="${cpx}" y2="${cpy}" stroke="#b85c2e" stroke-width="0.8" stroke-dasharray="2 2" />`;
        out += `<circle cx="${cpx}" cy="${cpy}" r="4.5" fill="${cfg.color}" stroke="white" stroke-width="2" />`;
      }
      // Graph title
      out += `<text x="${GX + GW/2}" y="${GY - 5}" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c2418" font-weight="700">${cfg.titleLbl}(${cfg.sliderLbl})</text>`;

      svg.innerHTML = out;
    }

    // ---- Auto-play: sweep the slider back and forth (period ~6 s) ----
    let playing = false;
    let startTs = 0;
    let startPhase = 0;
    const PERIOD_MS = 6000;
    function autoTick(ts) {
      if (!playing) return;
      if (!startTs) startTs = ts;
      const phase = startPhase + (ts - startTs) / PERIOD_MS * 2 * Math.PI;
      const mid = (cfg.sliderMin + cfg.sliderMax) / 2;
      const amp = (cfg.sliderMax - cfg.sliderMin) / 2;
      slider.value = mid + amp * Math.sin(phase);
      render();
      requestAnimationFrame(autoTick);
    }
    function startAuto() {
      // Sync start phase from current slider value so motion is continuous
      const v = parseFloat(slider.value);
      const mid = (cfg.sliderMin + cfg.sliderMax) / 2;
      const amp = (cfg.sliderMax - cfg.sliderMin) / 2;
      const ratio = clamp((v - mid) / amp, -1, 1);
      startPhase = Math.asin(ratio);
      startTs = 0;
      playing = true;
      autoBtn.textContent = '⏸ Pause';
      autoBtn.classList.add('running');
      requestAnimationFrame(autoTick);
    }
    function stopAuto() {
      playing = false;
      autoBtn.textContent = '▶ Auto';
      autoBtn.classList.remove('running');
    }
    autoBtn.addEventListener('click', () => playing ? stopAuto() : startAuto());

    slider.addEventListener('input', (e) => {
      // Manual interaction stops the auto-play
      if (playing && e.isTrusted) stopAuto();
      render();
    });
    render();
    return { render, startAuto, stopAuto };
  }

  initPanel(document.getElementById('panel-sin'), 'sin');
  initPanel(document.getElementById('panel-cos'), 'cos');
  initPanel(document.getElementById('panel-tan'), 'tan');
})();
</script>
</body>
</html>
